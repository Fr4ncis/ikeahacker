name: Desktop app

# Not on every push: three runners producing 90 MB installers is a lot of
# minutes for a change that usually only touches the web build. Tag a release,
# or run it by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci
      # The planner's own suites. The shell is only a window around them, so a
      # broken planner should stop the build before it packages anything.
      - run: npm test

      - run: npm ci
        working-directory: desktop
      # Builds the planner with the desktop settings, then the shell, then packages.
      - run: npm run dist
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: ikeahacker-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage


  # Publishing is its own job so that the three builds do not race each other
  # to create the release, and so that one platform failing still publishes the
  # others rather than losing the lot.
  #
  # Nothing here is signed, so macOS and Windows both warn on a first launch.
  # Signing needs an Apple Developer account and a Windows certificate; without
  # them the installers work, they just have to be opened past the warning.
  release:
    needs: build
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Publish the installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob globstar
          files=(installers/**/*.dmg installers/**/*.exe installers/**/*.AppImage)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no installers were built"; exit 1; }
          printf 'publishing %s\n' "${files[@]}"
          gh release view "$GITHUB_REF_NAME" --repo "$REPO" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$REPO" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$REPO" "${files[@]}" --clobber
